# web/ 의 SvelteKit 정적 사이트를 GitHub Pages 로 배포한다.
# 데이터는 web/static/data/*.enc (로컬에서 암호화해 커밋한 것)만 쓴다. 비밀번호는 CI 에 두지 않는다.
name: Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # 암호화 데이터가 아직 커밋되지 않았으면 빌드를 건너뛰고 준비 중 페이지만 올린다
      - id: data
        run: |
          if [ -f static/data/manifest.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::web/static/data 가 없어 배포를 건너뛰어요"; fi
      - if: steps.data.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.data.outputs.ready == 'true'
        run: npm ci
      - if: steps.data.outputs.ready == 'true'
        run: npm run build
        env:
          BASE_PATH: /uxtest
      # 데이터가 아직 없으면 "준비 중" 한 장만 올려 경로(/uxtest/)가 이 저장소로 가는지 확인할 수 있게 한다
      - if: steps.data.outputs.ready != 'true'
        run: |
          mkdir -p build
          cat > build/index.html <<'HTML'
          <!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="robots" content="noindex"><title>UX I/O 분석 · 준비 중</title></head>
          <body style="font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;display:grid;place-items:center;min-height:90vh;color:#191F28;background:#F9FAFB">
          <div style="text-align:center"><h1 style="font-size:22px">UX I/O 분석 사이트를 준비하고 있어요</h1>
          <p style="color:#4E5968">암호화한 데이터가 올라오면 이 주소에서 열려요.</p></div></body></html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
