# 갤러리 jank 분석용 Perfetto 설정 (G 시나리오가 trace 구간과 함께 켠다)
# - FrameTimeline: 예정 vs 실제 표시 시각 → jank 프레임 판정 (Android 12+)
# 메모리 버퍼에만 담고 측정이 끝난 뒤(kill -TERM) 파일로 쓴다 — write_into_file 로 흘려 쓰면
# traced 의 write(초당 ~2MB)가 fsio 측정 구간에 섞인다 (G1 dry-run 에서 56MB 확인).
# G2(≈12분) 용 경량판: sched_switch·atrace 를 빼고 FrameTimeline + I/O 대기 사유만 남긴다.
buffers { size_kb: 262144 fill_policy: DISCARD }
buffers { size_kb: 8192 fill_policy: DISCARD }
data_sources { config { name: "android.surfaceflinger.frametimeline" target_buffer: 0 } }
data_sources {
  config {
    name: "linux.ftrace"
    target_buffer: 0
    ftrace_config {
      ftrace_events: "sched/sched_blocked_reason"
      ftrace_events: "sched/sched_process_exit"
    }
  }
}
data_sources { config { name: "linux.process_stats" target_buffer: 1 process_stats_config { scan_all_processes_on_start: true } } }
duration_ms: 1800000
